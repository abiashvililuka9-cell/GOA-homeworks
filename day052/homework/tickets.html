<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./tickets.css">
    <title>Document</title>
</head>
<body>
    <div class="page-logo">
        Lobio
    </div>

    <div class="tickets-container">

        <div class="tickets-box">

            <h1>Buy Tickets</h1>

            <p class="description">
                Choose a movie, date and time.
            </p>

            <form>

                <label for="movie">
                    Movie
                </label>

                <select id="movie">
                    <option value="">Select a movie</option>
                    <option>The Odyssey</option>
                    <option>Spider-Man: Brand New Day</option>
                    <option>The Godfather</option>
                    <option>Supergirl</option>
                    <option>Reacher</option>
                </select>

                <label for="date">
                    Date
                </label>

                <select id="date">
                    <option value="">Select a date</option>
                    <option>Today</option>
                    <option>Tomorrow</option>
                    <option>Saturday</option>
                    <option>Sunday</option>
                </select>

                <label for="time">
                    Time
                </label>

                <select id="time">
                    <option value="">Select a time</option>
                    <option>12:00</option>
                    <option>15:00</option>
                    <option>18:00</option>
                    <option>21:00</option>
                </select>

                <button type="submit">
                    Continue
                </button>

            </form>

        </div>

        <a href="index.html" class="back-button">
            ← Back
        </a>

    </div>
</body>
</html>
