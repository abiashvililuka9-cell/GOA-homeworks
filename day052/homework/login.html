<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./login.css">
    <title>Document</title>
</head>
<body>
    
    <div class="page-logo">
        Lobio
    </div>

    <div class="login-container">

        <div class="login-box">

            <h1>Log In</h1>

            <form>

                <input
                    type="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Log In
                </button>

            </form>

        </div>

        <a href="index.html" class="back-button">
            ← Back
        </a>

    </div>

</body>
</html>
